name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate kwdb tables
        run: pnpm gen

      - name: Verify generated files are in sync with vendor/kwdb.xml
        run: |
          if ! git diff --quiet packages/vm/src/generated/; then
            echo '::error::Generated files differ from a fresh `pnpm gen`. Re-run locally and commit.'
            git --no-pager diff packages/vm/src/generated/
            exit 1
          fi

      # Build before typecheck so the per-package `tsc --noEmit` can resolve
      # @rezless/parser / @rezless/vm via their dist/*.d.ts. (Workspace
      # packages use the package `exports` map, which only exposes dist;
      # without a prior build, downstream packages can't see their
      # dependencies' types.)
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      # Huginn lives in a private repo; a public repo can't resolve a private
      # `uses:` action, so we check it out with a read-only PAT and run it
      # locally. Skipped on fork PRs, which get neither the secret nor the
      # OIDC token Huginn needs — so coverage recording never blocks CI.
      - name: Fetch Huginn action
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: i-doll/huginn
          ref: v1
          token: ${{ secrets.HUGINN_ACTION_READ_PAT }}
          persist-credentials: false
          path: .huginn
          sparse-checkout: action

      - name: Record coverage with Huginn
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: ./.huginn/action
        with:
          components: |
            js=coverage/lcov.info
            lsl=coverage/lsl/lcov.info
