name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check commit messages are conventional
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^)]+\))?!?: .+'
          status=0
          commits=$(git log --no-merges --format='%h %s' "$BASE..$HEAD")
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            echo "::error::Commit ${line%% *} is not a conventional commit: ${line#* }"
            status=1
          done <<< "$(grep -Ev "^[0-9a-f]+ ${pattern#^}" <<< "$commits" || true)"
          if ! grep -Eq "$pattern" <<< "$TITLE"; then
            echo "::error::PR title is not a conventional commit: $TITLE"
            status=1
          fi
          exit $status

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Regenerate LSL definition tables
        run: pnpm gen

      - name: Verify generated files are in sync with vendor/lsl_definitions.yaml
        run: |
          if ! git diff --quiet packages/vm/src/generated/ packages/parser/src/generated/; then
            echo '::error::Generated files differ from a fresh `pnpm gen`. Re-run locally and commit.'
            git --no-pager diff packages/vm/src/generated/ packages/parser/src/generated/
            exit 1
          fi

      # Build before typecheck so the per-package `tsc --noEmit` can resolve
      # @rezless/parser / @rezless/vm via their dist/*.d.ts. (Workspace
      # packages use the package `exports` map, which only exposes dist;
      # without a prior build, downstream packages can't see their
      # dependencies' types.)
      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: warn

      # Huginn lives in a private repo; a public repo can't resolve a private
      # `uses:` action, so we check it out with a read-only PAT and run it
      # locally. Skipped on fork PRs, which get neither the secret nor the
      # OIDC token Huginn needs — so coverage recording never blocks CI.
      - name: Fetch Huginn action
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: i-doll/huginn
          ref: v1
          token: ${{ secrets.HUGINN_ACTION_READ_PAT }}
          persist-credentials: false
          path: .huginn
          sparse-checkout: action

      - name: Record coverage with Huginn
        if: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
        continue-on-error: true
        uses: ./.huginn/action
        with:
          components: |
            js=coverage/lcov.info
            lsl=coverage/lsl/lcov.info
            slua=coverage/slua/lcov.info

  # Coverage instrumentation changes which code V8 optimises, so the suite
  # also runs without it on every supported Node: the current release and
  # each LTS line still in support. Update the list when that changes.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24', '26']
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.2

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      # V8 optimises a function only after many calls, so a NaN sign lost in
      # optimised code can pass a normal run. Optimising almost at once
      # catches it.
      - name: Test NaN signs with eager optimisation
        run: >-
          pnpm vitest run packages/vitest/test/nan-sign.test.ts --pool=forks
          --execArgv=--invocation-count-for-turbofan=2
          --execArgv=--invocation-count-for-maglev=1

  # The one check branch protection requires.
  ci:
    if: always()
    needs: [coverage, test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check every job passed
        env:
          COVERAGE: ${{ needs.coverage.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "coverage: $COVERAGE, test: $TEST"
          [ "$COVERAGE" = success ] && [ "$TEST" = success ]
